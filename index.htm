<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloco de Notas</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:Arial, sans-serif;
    }

    .bloco{
      width:400px;
      background:#1e293b;
      padding:20px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.4);
    }

    h1{
      color:#38bdf8;
      text-align:center;
      margin-bottom:15px;
    }

    textarea{
      width:100%;
      height:250px;
      border:none;
      outline:none;
      resize:none;
      border-radius:10px;
      padding:15px;
      font-size:16px;
      background:#334155;
      color:white;
    }

    textarea::placeholder{
      color:#cbd5e1;
    }
  </style>
</head>
<body>

  <div class="bloco">
    <h1>📝 Bloco de Notas</h1>

    <textarea placeholder="Digite suas anotações aqui..."></textarea>
  </div>

</body>
</html>
